<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Стань частью TYF Media!</title>
  <link rel="icon" type="image/jpeg" href="icon.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --yellow: #eae667;
      --yellow-bright: #f4f07a;
      --yellow-glow: rgba(234, 230, 103, 0.18);
      --text: #ffffff;
      --text-muted: #8e8e93;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      overflow-x: hidden;
    }

    .start-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
      max-width: 500px;
      position: relative;
      z-index: 1;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(234, 230, 103, 0.08);
      border: 1px solid rgba(234, 230, 103, 0.25);
      color: var(--yellow);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 99px;
      margin-bottom: 12px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--yellow);
      box-shadow: 0 0 8px var(--yellow);
    }

    .logo-wrap {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: clamp(180px, 35vh, 320px);
      margin-bottom: 8px;
    }

    .logo-wrap::before {
      content: '';
      position: absolute;
      width: 80%;
      height: 70%;
      background: radial-gradient(ellipse at center, var(--yellow-glow) 0%, rgba(0, 0, 0, 0) 70%);
      filter: blur(32px);
      z-index: -1;
      pointer-events: none;
    }

    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: transparent;
      filter: drop-shadow(0 4px 18px rgba(0, 0, 0, 0.6));
    }

    .slogan {
      font-size: clamp(24px, 6vw, 34px);
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 10px;
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    .slogan span {
      color: var(--yellow);
      text-shadow: 0 0 20px rgba(234, 230, 103, 0.3);
    }

    .subtext {
      color: var(--text-muted);
      font-size: clamp(13px, 3.5vw, 15px);
      line-height: 1.5;
      margin-bottom: 28px;
      font-weight: 500;
      max-width: 360px;
    }

    .btn-forward {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      width: 100%;
      max-width: 340px;
      background-color: var(--yellow);
      color: #000000;
      font-size: 16px;
      font-weight: 800;
      text-decoration: none;
      padding: 16px 24px;
      border-radius: 14px;
      letter-spacing: 0.5px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 8px 24px var(--yellow-glow);
    }

    .btn-forward svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: #000000;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.2s ease;
    }

    .btn-forward:hover {
      background-color: var(--yellow-bright);
      box-shadow: 0 12px 32px rgba(234, 230, 103, 0.45);
      transform: translateY(-2px);
    }

    .btn-forward:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <main class="start-container">
    <div class="badge">
      <span class="badge-dot"></span>
      TYF Media Staff 2026
    </div>

    <div class="logo-wrap">
      <img src="logo.jpg" alt="TYF Media" class="logo-img">
    </div>

    <h1 class="slogan">Стань частью <span>TYF Media!</span></h1>
    <p class="subtext">Присоединяйся к медиакоманде и создавай лучший студенческий контент вместе с нами</p>

    <a href="roles.html" class="btn-forward">
      <span>ВПЕРЕД</span>
      <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
    </a>
  </main>

</body>
</html>
